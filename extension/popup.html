<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustLens Inspector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">TrustLens</span>
          <span class="brand-badge">PRO</span>
        </div>
      </div>
      <div id="platform-badge" class="platform-badge">Detecting...</div>
    </header>

    <!-- Main Status Card -->
    <div class="status-card">
      <div class="status-meta">
        <h2 id="page-title" class="page-title">Scanning page...</h2>
        <div class="status-stats">
          <span id="review-count" class="count-pill">0 Reviews Found</span>
          <span id="status-indicator" class="status-pill status-ready">Ready</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="actions-group">
        <button id="btn-analyze" class="btn btn-primary" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          <span id="btn-analyze-text">Analyze in TrustLens</span>
        </button>

        <div class="btn-row">
          <button id="btn-copy-json" class="btn btn-secondary" title="Copy reviews as JSON" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
            </svg>
            Copy JSON
          </button>
          <button id="btn-copy-csv" class="btn btn-secondary" title="Copy reviews as CSV" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            Copy CSV
          </button>
          <button id="btn-refresh" class="btn btn-icon" title="Rescan page">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
              <path d="M16 21h5v-5"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Live Preview -->
    <div class="preview-section">
      <div class="preview-header">
        <span>Detected Reviews Preview</span>
      </div>
      <div id="reviews-preview-list" class="preview-list">
        <div class="empty-state">No reviews found yet. Make sure reviews are visible on this page.</div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- Footer -->
    <footer class="footer">
      <span>TrustLens Local v1.0</span>
      <a href="http://localhost:3000" target="_blank" class="footer-link">Open Dashboard</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
